[project]
name = "credit-engine"
version = "0.1.0"
description = "GenAI-CreditEngine — plataforma multiagente de concessão de crédito"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "uvicorn>=0.34.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.4",
]

[dependency-groups]
dev = [
  "pytest>=8.0.2",
  "pytest-asyncio>=0.23.8",
  "httpx>=0.27.0",
  "ruff>=0.6.5",
  "mypy>=1.9.0",
  "taskipy>=1.12.2",
]

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["credit_engine"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
addopts = "-vv"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.taskipy.tasks]
api = "uv run credit_engine"
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
